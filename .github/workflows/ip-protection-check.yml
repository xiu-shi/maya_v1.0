name: IP Protection Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run daily at 2 AM UTC to catch any issues
    - cron: '0 2 * * *'

jobs:
  ip-protection-check:
    name: Check IP Protection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for branch comparison
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Maya/backend/package-lock.json
      
      - name: Install dependencies
        working-directory: Maya/backend
        run: npm ci
      
      - name: Run IP Protection Tests
        working-directory: Maya/backend
        run: npm test -- tests/security_tests/ip-protection.test.js tests/security_tests/ip-protection-cicd.test.js
        continue-on-error: false
      
      - name: Report Results
        if: failure()
        run: |
          echo "::error::IP Protection check failed!"
          echo "::error::Please review the test output above for details."
          echo "::error::Do not commit IP-protected files, test files, or unauthorized documentation."
          exit 1
