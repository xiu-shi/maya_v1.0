# GitHub Actions: IP Protection Check
#
# Purpose: Enforce IP protection compliance on push, PR, and daily schedule.
# Created: Jan 30, 2026 | Reintroduced: Feb 2026
#
# Path Resolution (CRITICAL):
#   - Workflow runs with working-directory: Maya/backend
#   - Test files live at Maya/tests/security_tests/ (sibling of Maya/backend)
#   - Use ../tests/security_tests/ when running from Maya/backend
#   - Wrong path (tests/security_tests/) would look in Maya/backend/tests/ → 404
#
# Tests: ip-protection.test.js, ip-protection-cicd.test.js
#   - Tracked files, .gitignore compliance, commit messages, file content patterns

name: IP Protection Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  ip-protection-check:
    name: Check IP Protection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Maya/backend/package-lock.json

      - name: Install dependencies
        working-directory: Maya/backend
        run: npm ci

      - name: Verify test paths
        working-directory: Maya/backend
        run: |
          if [ ! -f "../tests/security_tests/ip-protection.test.js" ] || [ ! -f "../tests/security_tests/ip-protection-cicd.test.js" ]; then
            echo "::error::IP protection test files not found"
            ls -la ../tests/security_tests/ 2>/dev/null || echo "Directory does not exist"
            exit 1
          fi

      - name: Run IP Protection Tests
        working-directory: Maya/backend
        env:
          CI: true
        run: npm test -- ../tests/security_tests/ip-protection.test.js ../tests/security_tests/ip-protection-cicd.test.js
